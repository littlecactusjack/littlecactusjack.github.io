- id: L11
  name: bollinger_band_breakout
  # Stage numbering per reports/STAGES.md, adopted 2026-09-12.
  stopped_at: S5
  stopped_at_reason: >
    WITHDRAWN. The condition fired unconditionally at valid_from + (k-1) on every session. Its S6 placebo was measured BEFORE S5 was checked and is therefore meaningless - see degenerate_measurements.
  # ========================= WITHDRAWN 2026-09-11 =========================
  # REGISTERED 2026-09-10, WITHDRAWN THE NEXT DAY AS DEFECTIVE. Never run at Stage 1, no
  # trial ever spent, N unaffected at 684 and SR* at 0.1357. decisions.md 40.
  #
  # WHAT WAS REGISTERED WAS NEVER A BREAKOUT TEST. Measured directly on MGC, all 4,004
  # levels, both boundaries:
  #
  #     kbars=1: fired 4004, entry minute min=991 max=991   <- ZERO VARIANCE
  #     kbars=2: fired 4004, minute 992..995
  #     kbars=3: fired 4004, minute 993..1001
  #
  # 991 is exactly valid_from (RTH_OPEN + 60 + 1). The condition fires on the FIRST BAR IT
  # EXAMINES, for every level, every session. `confirmed_break` triggers on a run beyond the
  # level in EITHER direction, and price at 10:31 is never sitting exactly on a Bollinger
  # band - it is above or below - so one of the two runs is satisfied immediately and stays
  # satisfied. The registered condition reduces to "sample price at 10:31 and trade whichever
  # side of the band it is already on", once per session.
  #
  # THREE CONSEQUENCES, each measured rather than inferred:
  #   1. kbars is an OFFSET, not a selection. It shifts entry by exactly k-1 bars; every
  #      level fires under every setting (identical minutes across kbars: 0 of 4,004).
  #   2. `upper` and `lower` fire at IDENTICAL (row, minute). That is the 100% disjointness
  #      figure - not kbars cells colliding, but the two sides being the same event with
  #      opposite direction labels.
  #   3. The 6-cell grid is one event per session wearing six labels.
  #
  # THE MEASUREMENTS BELOW DESCRIBE THE DEGENERATE CONDITION, NOT THIS HYPOTHESIS.
  # They are kept because deleting them would hide what was actually run, and labelled
  # because carrying them forward to any replacement would be the error.
  degenerate_measurements:
    warning: >
      MEASURED ON THE DEFECTIVE CONDITION. NOT properties of Bollinger band breakouts and
      MUST NOT be carried into any replacement registration. A real breakout condition
      selects a different and far smaller population of events, so both the firing rate and
      the placebo match would have to be measured again from scratch.
    firing_rate:
      MGC: {cells: 6, per_cell: 4004, floor_180m: 2862}
      MNQ: {cells: 6, per_cell: 4123, floor_180m: 5884}
      note: >
        Identical across all six cells because the condition fires unconditionally once per
        session. This is a count of SESSIONS, not of breakouts.
    placebo_match:
      bb20k2_60m_upper: {MGC: {distance_ratio: 1.02, touch_ratio: 1.05}, MNQ: {distance_ratio: 1.06, touch_ratio: 0.94}}
      bb20k2_60m_lower: {MGC: {distance_ratio: 1.03, touch_ratio: 0.99}, MNQ: {distance_ratio: 0.90, touch_ratio: 1.04}}
      note: >
        All four inside the +/-25% tolerance - but this DOES NOT establish that a Bollinger
        placebo matches. The entry population here is every session at a fixed minute, so
        distance-from-price was effectively fixed by construction. The open question of
        whether a band placebo matches when the entry population is selected by an actual
        breakout is UNTESTED. See decisions.md 40.
  mechanism: >
    WITHDRAWN. The mechanism as written - self-fulfilling order clustering at widely watched
    default settings, the same weak premise as L08 - was never reached by the condition, which
    did not test a breakout. The premise is not disproved; it was not examined.
  condition: >
    WITHDRAWN AS DEFECTIVE. Registered as "confirmed break of the band boundary on 1h bars,
    mean +/- k*sigma, period 20 and k 2.0 fixed a priori, entry on the first run of kbars
    consecutive closes beyond the boundary". Measured to fire unconditionally at the first
    valid minute of every session in whichever direction price already sat. Not narrowed, not
    repaired - withdrawn. A corrected condition is DIFFERENT rather than tighter and is
    written up in decisions.md 40 WITHOUT being registered.
  horizon_minutes: [60, 120, 180]
  hold_hours: [1, 3]
  registered: 2026-09-10
  withdrawn: 2026-09-11
  status: excluded
  excluded_reason: >
    WITHDRAWN AS DEFECTIVE, not closed on evidence. The registered condition was never a
    breakout test: it fired on the first bar it examined for every level in every session,
    because `confirmed_break` triggers on a run beyond the level in either direction and
    price at the sampling minute is never exactly on a band. kbars shifted entry by k-1 bars
    rather than selecting events, and the upper and lower boundaries fired at identical
    (row, minute). NEVER RUN AT STAGE 1 AND NO TRIAL WAS SPENT, so N stays 684 and SR* stays
    0.1357 and nothing already closed is disturbed. The trial cost falling is a CONSEQUENCE
    of finding the defect and was not a reason for the change. decisions.md 40.
  grade: D+
  tier: C
  # ZERO. A withdrawn entry declares no parameters because it will never be tested, and
  # `test_excluded_and_dead_entries_declare_no_parameters` enforces exactly that. It was 2
  # (kbars, horizon) while the entry was live.
  param_cap: 0
  session: US
  symbols: [MNQ, MGC]
  registered_test_order: 19
  test_order: null
  schedulable: false
  provenance:
    source: third-party claim
    trial_count_available: false
    cost_assumption_available: false
    control_available: false
    prior_weight: none
    note: >
      Unchanged by the withdrawal. The external claim carried no prior weight when this was
      registered and carries none now; the defect was in this project's wiring, not in the
      claim.

- id: L12
  name: asia_session_extreme_reclaim_out_of_sample
  stopped_at: S7
  stopped_at_reason: >
    cleared S1-S6 including the S5 gate (entry-minute sd 202-206, hi/lo collision 0.0-0.1%),
    ran at S7 and is retired on S8 economics. reports/l12_stage1.md.
  # ================== REGISTERED 2026-09-11, BEFORE THE RUN ==================
  # THIS HYPOTHESIS WAS SUGGESTED BY LOOKING AT DATA. That is stated first because it is the
  # single most important fact about it. L04 tested three session types on MGC; sess_Asia
  # produced 5 of 18 nominal separations and sess_London produced none. Asia was SELECTED BY
  # ITS RESULT (decisions.md 43).
  #
  # Selection by result is not repaired by registering the survivor and re-testing it on the
  # SAME data - decisions.md 38 refused exactly that for L07's mirror, and 43 refused it here.
  # It IS repaired by testing the selected claim on data that did not generate it. MNQ is that
  # data: the Asia result came entirely from MGC, and MNQ is a different instrument with its
  # own order flow.
  mechanism: >
    UNCHANGED FROM L04 AND NOT STRENGTHENED BY THE MGC RESULT. Session extremes are reference
    prices participants transact against: a sweep beyond the Asia session's high or low that
    fails and closes back inside marks liquidity that was taken and rejected, so the move
    counter to the penetration is trading against a failed initiative. The counterparty is
    whoever was stopped or filled beyond the extreme. This is the SAME story L04 registered;
    nothing about the MGC numbers makes it more plausible, and the grade is unchanged.
  condition: >
    Sweep and reclaim at Asia-session extremes on MNQ, exactly as L04: price exceeds the level
    by >= m ticks then closes back inside within k bars, entry at the reclaim close, traded
    COUNTER to the penetration, exit at H minutes or 15:55 ET. m in {2, 4, 8} ticks, k in
    {2, 3, 5} bars, H = 180 only. Level = high and low of the Asia session. NINE CELLS.
  # ---- THE PREDICTION, STATED BEFORE THE RUN SO IT CANNOT BE ADJUSTED AFTER IT ----
  # On MGC the five separating cells gave +2.13 to +3.54 bps, and the nine sess_Asia cells
  # spanned +1.33 to +3.54. If the mechanism is real and instrument-independent, MNQ should
  # show the SAME SIGN and a broadly similar magnitude.
  prediction:
    registered: 2026-09-11
    direction: positive
    magnitude_bps: "+1.3 to +3.5, matching the MGC sess_Asia range"
    confirms_if: >
      A positive mean difference across the nine cells AND at least one cell surviving BH at
      FDR 0.05 within this hypothesis. Both, not either.
    refutes_if: >
      A mean difference at or below zero, or positive but with no BH survivor. A positive
      point estimate that fails correction is NOT a confirmation - it is what L04 already
      produced, and repeating it on a second instrument without clearing the bar leaves the
      claim exactly where it was.
    note: >
      The refutation criterion is deliberately symmetric with the confirmation one. Writing
      only the confirming condition is how a test becomes unfalsifiable.
  # ---- POWER, AND THE HONEST VERSION OF IT ----
  # MNQ sess_Asia fires 4,903-5,442 times against a TABULATED 180m floor of 5,884, which is
  # why L04/MNQ was never scheduled. That floor is the sample needed to resolve the SMALLEST
  # effect the pipeline can detect (15.66 bps at 180m on MNQ). It is not the applicable bar
  # for a specific predicted effect - decisions.md 38 decision 4 makes that argument for L07,
  # where 24,788 events resolved far less than the tabulated floor implied.
  # MGC separated on 2,715 PAIRED events; MNQ's ~5,400 firings should pair to more. So this
  # is powered for the +3.5 bps effect under test while remaining short for the tabulated
  # minimum. A NULL HERE IS THEREFORE WEAKER EVIDENCE than a null at full power would be,
  # and that is recorded now rather than discovered later.
  power:
    firings_per_cell: "4,903 - 5,442"
    tabulated_floor_180m: 5884
    applicable: >
      Powered for the predicted +1.3 to +3.5 bps effect; short of the tabulated floor for the
      pipeline's minimum resolvable effect. A null is correspondingly weaker evidence.
  placebo_match:
    measured: true
    level_type: sess_Asia
    product: MNQ
    distance_ratio: 0.92
    touch_ratio: 0.94
    verdict: ok
    note: Matched, measured before registration. reports/placebo_match.md.
  horizon_minutes: [180]
  hold_hours: [3]
  registered: 2026-09-11
  status: retired
  retired_reason: >
    RETIRED ON ECONOMICS, NOT ON SIGNIFICANCE. 0 of 9 cells separate and the mean difference
    is +0.306 bps against a 0.48 bps round-trip cost floor - 0.64x, not tradeable - and 4-11x
    short of its own registered +1.3 to +3.5 bps. Positive in 8 of 9 cells, so the SIGN
    survived; nothing else did.
    THE REFUTATION DELIBERATELY DOES NOT REST ON THE P-VALUES. The applicable BH rank-1
    threshold at this n is 2.82 bps (bootstrap SE 1.016), so a survivor was reachable only in
    the TOP FIFTH of the registered range - 6.8% power at the bottom of it. Citing p=0.5810
    as refutation would be the S4 error this programme exists to prevent. The pre-registration
    contained an unsatisfiable significance limb and that was not noticed until after the run;
    decisions.md 45 records it and proposes a standing S2 check.
    WHAT IT SETTLES: 76.2% power against L04's +3.54 bps, delivered +0.306 - that magnitude
    does not replicate out of sample. WHAT IT DOES NOT: whether a smaller real effect exists.
  grade: C
  tier: B
  param_cap: 2
  session: Asia
  symbols: [MNQ]
  registered_test_order: 20
  test_order: null
  schedulable: false
  # ---- MNQ ONLY, AND THAT IS THE ENTIRE POINT ----
  # The two-instrument Stage 4 requirement cannot be met and must not be. MGC is the
  # IN-SAMPLE instrument - it generated the claim - so adding it back would destroy the only
  # property that makes this registration worth anything. An out-of-sample test that includes
  # the data it is validating against is not one.
  stage4_reachable: false
  stage4_reason: >
    MNQ-only by construction. MGC generated this hypothesis, so it cannot also serve as the
    second instrument for a Stage 4 confirmation - including it would re-admit the selection
    this registration exists to escape. If MNQ confirms, the pair becomes eligible again on
    a later sample that is out-of-sample for BOTH.
  mechanism_instruments:
    primary: MNQ
    secondary: null
    rationale: >
      Session extremes as reference prices is not an instrument-specific story - which is
      exactly why MNQ is a fair test of a claim found on MGC. MGC is excluded not because the
      mechanism fails there but because it is the sample that produced the claim.
  # MEASURED, not declared - reports/level_rates.json, the L04/MNQ Asia cells.
  firing_rate:
    measured: true
    declared: null
    measured_on: '2026-09-09'
    report: reports/level_rates.md
    per_product:
      MNQ:
        cells: 9
        worst_cell: 4903
        best_cell: 5442
        required_180m: 5884
        best_over_180m_floor: 0.925
        events_sufficient_at_180m: false
    note: >
      SHORT OF THE TABULATED FLOOR and scheduled anyway, with the reason recorded in `power`
      above: the floor is the sample needed for the pipeline's MINIMUM resolvable effect, not
      for the specific +1.3 to +3.5 bps under test. MGC separated on 2,715 paired events.
  provenance:
    source: L04 Stage 1 on MGC, decisions.md 43
    selected_by_result: true
    prior_weight: none
    note: >
      SELECTED BY RESULT and says so. The registration exists to test that selection on
      independent data, which is the only thing that can repair it. It inherits no grade, no
      tier and no credibility from L04 - it inherits a claim and a prediction.
  verdict_route:
    per_cell: nine cells, BH within the hypothesis at FDR 0.05
    aggregate: >
      ASSUMED CLOSED. m and k select overlapping subsets of the same reclaim, exactly as in
      L04 where the measured overlap was 98%.
  report: reports/l12_stage1.md
  cells: reports/l12_cells.json
