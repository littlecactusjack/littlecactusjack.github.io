- id: L08
  name: moving_average_reaction
  # Stage numbering per reports/STAGES.md, adopted 2026-09-12.
  stopped_at: S4
  stopped_at_reason: >
    below the detection floor: best cell 698 MGC / 705 MNQ, 0.24x and 0.12x.
  mechanism: >
    WEAK BY CONSTRUCTION AND THE ENTRY SAYS SO. No institution executes against a 50 EMA. The
    only available story is self-fulfilling: enough traders watch the same standard settings
    that orders cluster near them. Note this is the same premise that DISQUALIFIED F11 as a
    control - "widely watched, therefore orders cluster" is a claim about the market that must
    be tested rather than assumed. Testing it here is legitimate; it simply makes the prior
    weak, and the grade reflects that. THE COUNTERPARTY, SUCH AS IT IS: the retail trader whose
    resting order or stop sits at a round standard setting because a chart platform drew the
    line there. That is a real person transacting for a non-informational reason, which is what
    Stage 0 asks for - but unlike L01's execution desk, nothing obliges them to be there, and
