  # ---- S8 CROSS-MARKET ROUTE IS CLOSED BEFORE IT IS TRIED ----
  # MGC's real touch rate is 11.5%: gold's session range rarely spans two 50-point grid steps,
  # so most of its level population is unreachable within a session. The S6 match on MGC is
  # genuine - a correctly matched placebo against a mostly-unreachable population - which
  # makes it easy to misread as an open route. It is not one. N02 cannot use MGC as a
  # robustness instrument and its S8 evidence must come from the ERA SPLIT alone.
  s8_cross_market:
