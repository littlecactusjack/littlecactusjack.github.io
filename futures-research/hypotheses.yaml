    mattered. NO TRIAL SPENT. decisions.md 46.
  mechanism: >
    Breakout entrants place stops back inside the level they broke. A break that fails traps
    them, and their forced exit is price-insensitive supply in the reversal direction. THE COUNTERPARTY is the breakout buyer; they keep doing it because breakout entry is the most widely
    taught retail pattern and the losses are attributed to "fakeouts" rather than to the entry
    rule itself. This is a flow story, not a self-fulfilling-watching story - which is what
    separates it from L08 and L11, whose premise this catalogue has twice found too weak.
  condition: >
    5-minute fractal pivot levels, lookback L = 20 bars each side. Entry on a CONFIRMED BREAK:
    the first run of k = 3 consecutive 5m closes beyond the pivot, traded COUNTER to the break
    (fading it). Exit at H = 180 minutes or 15:55 ET. Break depth d in {16, 24} ticks. MNQ.
    Upper and lower breaks are separate directions and separate cells.
  # ---- PARAMETERS ARE A SPECIFICATION CHOICE INFORMED BY A TRANSFERRED CURVE ----
  # L = 20 and d = 16-24 were sited from L07's selectivity sweep, extended past its own grid
  # edge (decisions.md 45). TRANSFER LIMITATION, STATED HERE AND NOT IN A FOOTNOTE: both
  # optima and both exponents are measured on L07, WHOSE MECHANISM SECTION 38 REFUTED. Drift
  # was excluded at 1.2% so the effect is real and reproducible even though its interpretation
  # is wrong, and the selectivity curve is plausibly generic to thresholded conditions - but
  # it is a TRANSFER, not a fit. If N04's own selectivity behaviour diverges from L07's once
  # measured, this parameter choice is wrong and must be revisited.
  parameter_provenance:
    sited_from: L07 selectivity sweep, reports/sweep_tight_l07.json
    principle: >
