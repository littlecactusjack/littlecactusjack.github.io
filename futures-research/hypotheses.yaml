- id: N02
  name: round_number_cross_continuation
  stopped_at: S7
  stopped_at_reason: >
    Ran at S7 2026-09-13: 0 of 3 separate, 0 BH survivors, cells disagree on sign. Retired on
    the pre-registered refutation clause. reports/n02_stage1.md, decisions.md 51.
  mechanism: >
    Osler (2003, Journal of Finance) documents from a major FX dealing bank's complete order
    book that stop-loss orders cluster JUST BEYOND round numbers while take-profit orders
    cluster AT them; Osler (2005, JIMF) shows rates trend rapidly after reaching
    stop-cluster levels. Stops are positive-feedback: crossing the level triggers them and
    extends the move. THE COUNTERPARTY is the trader whose stop sits in the obvious cluster,
    and they keep doing it because stops are placed at the same round-number anchors that
    define the level - anchoring is a cognitive default that does not decay with experience.
    This is the best-evidenced mechanism in the N-series draft and the only one resting on a
    published order-book study rather than on inference from price.
  condition: >
    Round-number levels on a 50-point grid: the two nearest levels above and the two below the
    SESSION-OPEN close, four per session, valid from the open (decisions.md 49). Price trades
    THROUGH a level by d points from the side it started on; enter in the break direction,
    exit at H = 180 minutes or 15:55 ET. d in {2, 4, 8} points, H = 180. MNQ. Three cells.
  # ---- S3 MEASURED, AND IT OVERTURNED THE DRAFT'S ASSUMPTION ----
  # The draft assumed crosses were a SUBSET of approaches and therefore rarer ("lower than
  # N01"). Measured on MNQ: of 32,590 round-number events, 26,200 (80.4%) CROSS and 6,390
  # (19.6%) merely approach - a cross/approach ratio of 4.10. Price that reaches a round
  # number usually goes through it. The assumption was backwards, and it decides which of the
  # two round-number candidates is registrable.
  s3_firing_rate:
    measured: '2026-09-12'
    product: MNQ
    total_round_number_events: 32590
    crosses: 26200
    approaches: 6390
    cross_approach_ratio: 4.10
    note: >
      MEASURED, NEVER DECLARED. The definition of a cross was fixed before measuring and was
      not adjusted afterwards: through the level by >= 2 points on the far side from the
      approach, within 60 minutes.
  # ---- S2 RECOMPUTED ON THE CORRECTED POPULATION, 2026-09-13, BEFORE ANY TRIAL ----
  # The original check below was computed on the CIRCULAR population (26,200 events) and no
  # longer describes what will run. The corrected population fires 6,596-7,105 times at
  # 2.24 events/session, with DEFF MEASURED at 1.42-1.66 - lower than the 2.19 measured at
  # 7.68 events/session, as expected for sparser events. The verdict moves from PROVABLE to
  # STRADDLES. Registered under surface-don't-reject, same standing N05 had.
  s2_check:
    recomputed: '2026-09-13'
    population: corrected, two grid levels either side of the session open
    cells: 3
    k_note: >
      THREE CELLS, NOT NINE. The grid is d in {2,4,8} at H=180 only. An earlier version of this
      entry said nine; BH rank-1 is computed at k=3.
    per_d:
      "2": {events: 7105, deff: 1.47, units: 4821, bh_bar_bps: 2.23}
      "4": {events: 6938, deff: 1.42, units: 4896, bh_bar_bps: 2.21}
      "8": {events: 6596, deff: 1.66, units: 3971, bh_bar_bps: 2.46}
    predicted_range_bps: [2.0, 5.0]
    verdict: >
      STRADDLES. The bottom of the predicted range (2.0) sits below the BH bar (2.21-2.46), so a
      survivor is unreachable for a true effect in roughly the lowest 5-10% of the range.
      eff/bar at midpoint 1.42-1.58, eff/cost 7.3x. A null from N02 is correspondingly weaker
      evidence for effects near 2 bps.
    superseded_check:
      events: 26200
      bh_rank1_threshold_bps: 1.64
      verdict: PROVABLE ACROSS RANGE
      why_superseded: computed on the circular population of decisions.md 49
  prediction:
    registered: 2026-09-12
    direction: positive
    magnitude_bps: "+2.0 to +5.0"
    confirms_if: positive mean AND at least one BH survivor at FDR 0.05
    refutes_if: mean at or below zero, OR positive with no BH survivor
  # ---- S6 IS EXPECTED TO BE BUILDABLE, UNLIKE N04/N05 ----
  # Round numbers are established AT A DISTANCE from the prevailing price, so they have a
  # non-degenerate distance distribution and the arbitrary-region placebo of decisions.md 37
  # applies. That is exactly what N04/N05 lacked (61.4% zero-distance). It is an EXPECTATION,
  # not a measurement - S6 must still be built and matched before this can be scheduled.
  s6_placebo:
    built: true
    measured: '2026-09-13'
    verdict: MATCHED on both products
    MNQ: {levels: 16496, real_touch: 0.401, placebo_touch: 0.395, touch_ratio: 0.98, distance_ratio: 0.82}
    MGC: {levels: 16020, real_touch: 0.115, placebo_touch: 0.122, touch_ratio: 1.06, distance_ratio: 0.88}
    construction_correction: >
      THE FIRST ATTEMPT FAILED AND THE FAILURE WAS MINE. The population admitted a grid level
      only when price came within 0.5 points of it, so real levels were touched 100.0% BY
      DEFINITION and the placebo was asked to match an outcome the population was selected on.
