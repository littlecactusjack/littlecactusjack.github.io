- id: F06
  name: cash_open_drive_continuation
  mechanism: >
    09:30 ET is a genuine liquidity event and the largest participant-composition change in
    the day: overnight positioning meets cash liquidity and the imbalance resolves. Gao et
    al. use the first half-hour precisely because that is where the day's directional
    information concentrates. The counterparty is whoever holds the overnight position that
    must be adjusted once real depth arrives. This differs from F01 by trading the NEAR
    continuation rather than the close.
  condition: >
    range = high/low over [09:30, 09:30 + W]. On a close beyond the range boundary, enter
    that direction and exit at H hours or 15:55 ET. W in {5, 15, 30} min, confirm in
    {close beyond, 2 closes beyond}, H in {1, 2, 3} h, vol_filter in {none, >median}.
  horizon_minutes: [60, 120, 180]
  registered: 2026-08-28
  # ---- REGISTRATION AUDIT 2026-09-02: TWO DEFECTS, NEITHER FIXED HERE ----
  #
  # 1. INSTRUMENT (attenuated, not fatal). The mechanism names 09:30 ET as the moment
  #    "overnight positioning meets CASH liquidity". That is the EQUITY cash open. Gold's
  #    own liquidity event is the COMEX open at 08:20 ET. On MGC this condition therefore
  #    tests a cross-asset spillover from the equity open rather than the registered
  #    mechanism. It may still be run - unlike F02's MGC, the mechanism is weakened rather
  #    than absent - but an MGC result cannot carry the registered claim.
  #
  # 2. vol_filter IS UNDEFINED, AND IT GATES THE FIRING RATE. The condition says
  #    "vol_filter in {none, >median}" without saying median OF WHAT, measured over WHAT
  #    WINDOW. reports/measured_rates.md had to pick a reading to count at all (20-session
  #    realised vol against its own trailing 250-session median), and that reading is a
  #    MEASUREMENT CONVENIENCE, not a registered choice. It changes the event count and so
  #    changes whether F06's routes are open.
  #
  # THE DECISION REQUIRED, which is not mine to make: what quantity does the vol filter
  # threshold, and over what lookback? The same gap exists in F01 and should be settled the
  # same way for both.
  # ---- RETIRED 2026-09-02: NULL ON THE ONLY OPEN ROUTES, AND A WEAK ONE ----
  # reports/f06_stage1.md. 36 cells on MGC, 36 trials. MNQ was not run.
