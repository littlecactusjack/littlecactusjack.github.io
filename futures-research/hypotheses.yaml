  mechanism: >
    The only level in this catalog where a named participant has a stated reason to transact
    at it. Institutional execution algorithms are benchmarked to VWAP: a desk filling a large
    order is measured on whether it beat VWAP, which creates genuine non-discretionary flow
    referencing that specific price. Buy programs become more aggressive below VWAP and
    passive above it. The counterparty is the execution desk whose benchmark is the level
    itself. NOTED WEAKNESS, flagged at registration: the mechanism predicts flow TOWARD VWAP,
    not reversal AT it, so the absorption direction is an additional assumption the mechanism
    does not license. That is the weakest link in the strongest entry here.
  condition: >
