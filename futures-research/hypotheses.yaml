# Hypothesis registry — Stage 0 of the research pipeline (see CLAUDE_FUTURES.md §5).
#
# Every hypothesis is registered HERE BEFORE it is tested. Nothing is tested that does not
# appear in this file, and the `mechanism` field must name who is paying you and why. If it
# cannot be written in plain language, the hypothesis is rejected.
#
# Prose, evidence grades, full signal pseudocode and the "why it might fail" notes live in
# FUTURES_STRATEGY_HYPOTHESES.md. This file is the machine-readable registry.
#
# SCHEMA (required)   id · name · mechanism · condition · horizon_minutes · registered · status
# SCHEMA (metadata)   grade · tier · param_cap · session · hold_hours · test_order · symbols
#
# status values
#   untested                    registered, Stage 1 not yet run
#   stage1_inconclusive         Stage 1 ran and settled nothing — see below
#   stage1_passed               Stage 1 cleared; not scheduled onward — see below
#   retired                     withdrawn from testing, kept in the registry
#   excluded                    never testable on this sample — see below
#   dead                        structurally invalidated — do not test
#
# STATUS VOCABULARY CARRIED OVER FROM THE CRYPTO PROJECT, where the distinctions were
# learned the hard way:
#
#   retired vs stage1_inconclusive. Retirement says the evidence points AGAINST the
#   mechanism. Inconclusive says the evidence points the way the mechanism predicts but
#   does not clear the bar, and the shortfall is power or multiplicity rather than sign or
#   story. Collapsing them loses the distinction that decides whether a hypothesis is ever
#   worth revisiting — F05 is here at all because crypto's S09 was recorded inconclusive
#   rather than retired.
#
#   stage1_passed IS NOT A PROMOTION. It records that the signal-level gate was cleared and
#   nothing more; §5 has nine stages after it. Crypto's S08 cleared Stage 1 and was still
#   uneconomic, and filing that as a failure would have lost the information that the
#   effect exists.
#
#   excluded is NEW here. It means the hypothesis cannot be evaluated on this sample at
#   all, on measured grounds, before any trial is spent. F12 and F13 carry it. This is not
#   a soft rejection: it is the firing-rate gate and the decay literature doing their job
#   in advance, and it costs zero trials.
#
# An entry that is not `untested` carries a reason field and `test_order: null`, so nothing
# schedules it. Whatever trials it generated stay in trials.jsonl and stay in N. Every §6
# correction moves in the optimistic direction as N falls, so withdrawing a hypothesis must
# never become a route to shrinking it.
#
# Universal constraints (FUTURES_STRATEGY_HYPOTHESES.md, "Universal rules"):
#   - every hypothesis tests on MNQ and MGC; they are genuinely uncorrelated, which makes
#     §5 Stage 4 a real gate here rather than the near-formality it was at BTC/ETH ρ=0.835
#   - ES/YM/RTY are ρ≈0.9 with NQ — robustness check only, NEVER Stage 4 evidence
#   - FLAT BY 17:00 ET, no exceptions; every hold must provably terminate before it
#   - sessions anchored in exchange local time and converted — never a fixed ET offset
#   - param_cap is a HARD cap (CLAUDE_FUTURES.md §5 Stage 5)
#   - every candidate beats a random-entry benchmark with matched holding-time distribution
#   - every candidate beats scaled buy-and-hold (index futures have real drift)

- id: F01
  name: market_intraday_momentum
  mechanism: >
    The first half-hour market return, measured from the previous close, predicts the last
    half-hour return (Gao, Han, Li & Zhou, JFE 2018). Baltussen, Da, Lammers & Martens
    (JFE 2021) supply the mechanism: hedging demand. A 2x or 3x leveraged ETF must rebalance
    daily to maintain its multiple — buying more exposure if the index rose, selling if it
    fell — which is structurally a short-gamma profile, and the resets are pegged to the
    closing price so the adjustment concentrates in the final minutes. Options dealers who
    are short gamma must trade the same direction to stay hedged. The counterparty is not a
    trader forming a view; it is a risk system executing a formula whose direction is known
    in advance from the day's return. Nomura estimated that at peak size every 1% move
    required the leveraged ETF complex to trade $10 billion.
  condition: >
    r1 = return from previous close (16:00 ET) to 10:00 ET. At entry_time, if
    |r1| > k * ATR(20d), enter in the direction of r1 and exit at 15:55 ET.
    entry_time in {15:00, 15:30}, k in {0, 0.5, 1.0}, vol_filter in {none, >median, >p66}.
    k=0 is the unconditional version and is tested — the papers find the effect
    unconditionally, with volatility strengthening rather than enabling it.
  horizon_minutes: [30, 60]
  registered: 2026-08-28
  # BLOCKED 2026-09-02 BEFORE ANY STAGE 1 RUN — reports/detectability.md.
  # Closed on BOTH verdict routes. This is arithmetic done ahead of testing, not a
  # finding about the market: F01 has never been run and nothing here says it would
  # fail. It says the catalog could not tell if it had.
  #
  # PER-CELL ROUTE: CLOSED. entry_time is a grid axis, so a cell fixes it and fires at
  # most once a session.
  #     MNQ   4,125 events against 19,722 where a floor resolves   4.8x short
  #     MGC   4,006 events against  5,620                          1.4x short
  # All four (instrument, horizon) combinations are BELOW SWEPT RANGE.
  #
  # AGGREGATE ROUTE: ALSO CLOSED, AND FOR F07'S EXACT REASON. Pooling scanned positions
  # restores sample only when they are DISJOINT IN TIME. F01's two entry times are
  # 15:00 and 15:30 — but BOTH EXIT AT 15:55. The two positions therefore overlap for
  # all but thirty minutes of their lives:
  #
  #     15:00 entry  |---------------------------|  exit 15:55  (55 min)
  #     15:30 entry              |---------------|  exit 15:55  (25 min)
  #                              ^^^^^^^^^^^^^^^^^  25 of 25 minutes shared
  #
  # The later position is entirely contained in the earlier one. Pooling them stacks
  # two near-duplicate readings of the same ~4,000 sessions rather than accumulating
  # 8,000 independent ones, so the aggregate ceiling stays at the per-cell ceiling.
  # Same structural defect as F07, found by reading the EXIT rule rather than the
  # entry times — two entries at different clock times still overlap if they share a
  # fixed exit.
  #
  # SO F01 IS CLOSED ON BOTH ROUTES, not merely blocked at its stated holds. Extending
  # the horizon list would not help: the constraint is the once-per-session event rate,
  # and a longer hold lowers the independent count rather than raising it.
  #
  # WHAT WOULD UNBLOCK IT. Nothing available in this dataset. A once-a-session
  # condition on sixteen years yields ~4,000 events; MNQ needs 19,722. That gap is a
  # factor of five in SESSIONS, not in sampling effort — roughly eighty years of data.
  # Either the condition fires more often, or F01 is not testable to this standard.
  # Note the asymmetry: MGC is only 1.4x short, so a floor measured at a smaller sample
  # would open MGC alone — but MGC carries the coverage caveat, so that route leads to
  # a weak-form verdict on the wrong instrument for an EQUITY INDEX momentum claim.
  #
  # NO TRIALS SPENT. Nothing was run, so N is unchanged.
  status: blocked_insufficient_events
  blocked: 2026-09-02
  blocked_reason: >
    Closed on both verdict routes before any Stage 1 run. Per-cell:
    entry_time is a grid axis so a cell fires once a session, giving
    4,125 events on MNQ against the 19,722 at which a floor resolves
    and 4,006 on MGC against 5,620 — all four combinations below the
    swept range. Aggregate: the two entry times 15:00 and 15:30 BOTH
    EXIT AT 15:55, so the later position is entirely contained in the
    earlier one and pooling stacks two near-duplicate readings of the
    same ~4,000 sessions instead of accumulating 8,000 independent
    ones. Same structural defect as F07, found by reading the exit rule
    rather than the entry times. This is arithmetic done ahead of
    testing, not evidence: F01 was never run and nothing here says it
    would fail. No trials spent.
  grade: A
  tier: A
  param_cap: 3
  session: US
  hold_hours: [0.5, 1]
  # Blocked before running; nothing should schedule it.
  registered_test_order: 1
  test_order: null
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      Leveraged-ETF rebalancing and index options dealer gamma are EQUITY-INDEX mechanisms. Le
      veraged gold ETFs exist but the complex is orders of magnitude smaller and is not pegged
       to the equity close, so MGC is ATTENUATED rather than impossible.
  falsification_note: >
    Effect size is ~1 bps per session (2.47% annualized at Sharpe 0.49), which nets ~0.5 bps
    against MNQ's 0.48 bps floor — positive but thin, and it would have been dead in crypto.
    Published 2018 and widely known since, so decay is likely and must be tested by regime.
    The leveraged-ETF literature is contested: Lenkey (2024) finds the associations
    significant but argues the economic magnitudes are not. Take the mechanism as plausible,
    not established. Exit at 15:55 rather than into the close, where the flow concentrates
    but the spread is widest.

- id: F02
  name: order_imbalance_conditional_overnight_reversal
  mechanism: >
    Intermediaries absorb order imbalances at the NYSE close and are compensated for
    carrying that inventory through higher overnight returns, earning much of it when
    European markets open and the risk can be offloaded (Boyarchenko, Larsen & Whelan,
    RFS 2023; Grossman-Miller inventory risk). The counterparty is the closing auction
    participant who needed liquidity at 16:00. The conditional finding is asymmetric and
    the asymmetry follows from the mechanism: a dealer absorbing a SELL imbalance holds
    unwanted long inventory and must be paid to carry it, so selloffs generate robust
    positive overnight reversals while reversals after rallies are much more modest.
  condition: >
    imb = return from 15:00 to 16:00 ET, a proxy for the closing order imbalance. If
    imb < -k * sigma, enter long at the window open and exit at the window close; direction
    is opposite the imbalance. The symmetric long-side condition is tested separately and
    expected to be weaker. k in {0.5, 1.0, 1.5}, window in {Europe 01:30-04:00,
    Asia 19:00-22:00}, hold in {1, 2, 4} h.
  horizon_minutes: [60, 120, 240]
  registered: 2026-08-28
  # STAGE 1 RUN 2026-09-02, RECORDED UNINFORMATIVE - reports/f02_stage1.md.
  # 144 cells: 3 k x 2 windows x 3 holds x 2 arms x 2 eras x 2 instruments. The largest
  # single trial spend in this catalog.
  #
  # EVERY CELL IS UNINFORMATIVE, AND THE GATE DID NOT PREDICT THAT. Detectability showed
  # F02 with an open per-cell route on MGC 120m/240m and an open aggregate on 5 of 6.
  # Both rested on a DECLARED firing rate of one per session, and the declared rate was
  # wrong by an order of magnitude:
  #
  #     gate assumed   4,006-4,125 per cell        aggregate 6,142-8,250
  #     actually       106-707 per cell            aggregate ~210-1,414
  #
  # Two causes, neither propagated into the gate. FIRST, the condition is THRESHOLD-
  # GATED: it fires only when |imb| > k*sigma, measured at 6-23% of rows depending on k,
  # not every row. The declared rate counted the OPPORTUNITY, not the TRIGGER. SECOND,
  # the mandatory regime split halves the sample again - pre-2021 holds ~3,100-3,200
  # rows and post-2021 ~1,730 - and nothing told the gate this hypothesis must be
  # evaluated in two eras. See decisions.md section 21.
  #
  # RESULTS, DESCRIPTIVE ONLY. 0 nominal separations across all 144 cells against 7.2
  # expected by chance; 0 BH survivors in every (instrument, era, arm) family and across
  # the whole hypothesis. Zero against 7.2 is itself informative about the TEST rather
  # than the market: within a family the 18 cells share entry dates heavily (same k, and
  # holds are nested), so the effective number of independent looks is far below 144.
  #
  # THE ONE DIRECTIONALLY CONSISTENT RESULT, AND IT IS NOT EVIDENCE. MNQ post-2021
  # sell_imb - the mechanism's primary arm, on the equity index, in the live era -
  # aggregates +3.27 bps gross and +2.79 net, with a best cell of +12.97 bps at 0.83x
  # its floor and p=0.0726. That is the only family pointing the predicted way. It rests
  # on 121-393 events against floors measured at 2,862 and up, so it CANNOT be evidence,
  # and it is recorded here so that a future re-test knows where to look rather than as
  # a finding.
  #
  # THE DECAY QUESTION IS NOT SETTLED AND CANNOT BE. Both sell_imb arms are LARGER
  # post-2021 than pre-2021, which is the opposite of the decay the authors report for
  # the unconditional version. But neither era's cells are informative, so this is a
  # difference between two quantities individually indistinguishable from zero.
  #
  # NO REAL-DATA CONTROL EXISTS AT THIS EVENT REGIME. F14 validated the harness at
  # ~48,000-52,000 events; F02's cells hold 106-707. No control can be built here: a
  # once-a-session condition yields ~3,500 events before threshold gating, and F02 fires
  # on 6-23% of those and then splits the remainder in two. This null carries the
  # section 7.2 synthetic GARCH assurance and NOTHING from F14.
  #
  # NEITHER INSTRUMENT CARRIES A VERDICT. MGC was named by the gate as the open route
  # and closes once the real rate is used. Worth stating anyway: F02 is an EQUITY-INDEX
  # hypothesis whose counterparty is the NYSE closing auction, and a gold contract has
  # no NYSE close - an MGC result would have been the wrong instrument for this claim
  # even had it been informative. MGC's coverage here is 46.14%, the lowest of any
  # window in the study.
  # ---- REGISTRATION ERROR, RECORDED 2026-09-02: MGC SHOULD NEVER HAVE BEEN RUN ----
  #
  # F02's counterparty is the NYSE CLOSING AUCTION participant who needed liquidity at
  # 16:00, and the compensation is paid to dealers carrying INDEX inventory overnight. Gold
  # has no NYSE closing auction. The mechanism cannot exist in MGC - not weakly, not in
  # attenuated form, not at all.
  #
  # This was a REGISTRATION ERROR, not a data problem. `symbols: [MNQ, MGC]` was set by
  # default rather than derived from the mechanism, and nothing in the pipeline asked
  # whether the mechanism could hold in both. 72 of the 144 trials went to an instrument
  # where the hypothesis was not defined. They still count toward N - the looks happened -
  # but they could never have been evidence for or against this claim.
  #
  # Stage 0 now requires every entry to name which instruments its mechanism can exist in
  # (CLAUDE_FUTURES.md 5.10). F02 is the case that prompted it.
  status: stage1_uninformative
  stage1_run: 2026-09-02
  stage1_reason: >
    Every one of 144 cells is below the swept range, and the gate did
    not predict it: the declared firing rate of one per session counted
    the opportunity rather than the trigger, ignoring both the k*sigma
    threshold (fires on 6-23% of rows) and the mandatory regime split
    (halves the sample again). Cells hold 106-707 events against floors
    measured at 2,862 and up. 0 nominal separations against 7.2
    expected, 0 BH survivors anywhere - but zero against 7.2 reflects
    heavy sharing of entry dates within each family, so effective
    independent looks are far below 144. MNQ post-2021 sell_imb is the
    only family pointing the predicted way (+3.27 bps aggregate, best
    cell 0.83x floor, p=0.0726) and it could not be evidence at this
    sample. No real-data control exists at this event regime. Not
    retired: no route could have carried a verdict. 144 trials spent.
  grade: A-
  tier: A
  param_cap: 3
  session: Asia/Europe
  hold_hours: [1, 4]
  # Ran and produced no obtainable evidence; nothing should reschedule it
  # as registered. Registration priority preserved, not renumbered.
  registered_test_order: 4
  test_order: null
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: null
    rationale: >
      The counterparty is the NYSE CLOSING AUCTION participant. Gold has no NYSE closing aucti
      on, so the mechanism cannot exist in MGC at all.
  # REGIME SPLIT IS MANDATORY HERE, NOT OPTIONAL. See F13: the same authors published
  # "The Disappearing Overnight Drift" in July 2026 reporting that the UNCONDITIONAL
  # 02:00-03:00 window has averaged near zero since 2021, having previously carried more
  # than 60% of the contract's 5.9% annualized close-to-close return. Pre-2021 and
  # post-2021 are different objects and an aggregate over both is uninterpretable.
  falsification_note: >
    The headline effect is measured as decayed by its own authors, and the conditional
    version may have gone with it. The closing return is a proxy for order imbalance, not
    the imbalance itself — the paper had actual imbalance data and this project does not.
    Test the Asian-window migration too: the authors note dealers increasingly offload
    inventory shocks at the Asian open as trading there has grown.

- id: F03
  name: half_hour_periodicity
  mechanism: >
    Returns are persistent at the same half-hour interval across trading days, persisting up
    to 40 trading days (Heston, Korajczyk & Sadka). The cause is institutional execution:
    large parent orders are worked over multiple days at similar clock times, producing
    repeating flow at the same positions in the session. Later work attributes this
    specifically to REPETITIVE institutional traders — non-repetitive institutions show
    little to no predictability. The counterparty is whoever provides liquidity into a
    schedule that an execution algorithm is following regardless of price. This is the
    futures analogue of the crypto quarter-hour hypothesis, with a better-documented cause.
  condition: >
    For each half-hour slot s in the RTH session, hist = mean return of slot s over the
    trailing N days. If |hist| > threshold and the trailing t-stat is significant, enter at
    the slot open in sign(hist) direction and exit at the slot close.
    N in {10, 20, 40} days, threshold in {0.5, 1.0, 1.5} x slot sigma, all 13 RTH slots.
  horizon_minutes: [30]
  registered: 2026-08-28
  # RETIRED 2026-09-01 after Stage 1 on both instruments — reports/f03_stage1.md.
  # 234 cells: 13 RTH slots x 3 lookbacks x 3 thresholds, MNQ and MGC, all scored.
  #
  # THE MECHANISM IS REFUTED, NOT UNDERPOWERED. That distinction is the whole reason
  # this is `retired` and not `stage1_inconclusive`. F03 was one of the few hypotheses
  # reports/detectability.md CLEARED on both instruments — it fires 13 times a session
  # and reached 53,625 INDEPENDENT events on MNQ against a floor that resolves at 2.57
  # bps. (The 150,355 figure in reports/f03_stage1.md is the sum across all 117 cells,
  # which double-counts: the 9 (N, threshold) variants of a slot trade the SAME slot
  # and overlap. The independent aggregate is 13 disjoint slots x 4,125 sessions =
  # 53,625, still comfortably above the 19,722 where a floor resolves.) It had
  # the power. It found nothing.
  #
  #   MNQ   8 nominal separations against 5.9 expected by chance; 0 survive BH at
  #         FDR 0.05 (smallest p 0.0066 against a rank-1 threshold of 0.000427)
  #   MGC   0 nominal separations against 5.9 expected; smallest p 0.0707
  #
  # AND THE EIGHT ARE NOT EIGHT. All eight are NEGATIVE — significant losses, not
  # gains — and SEVEN of them are the same 09:30-10:00 slot under near-duplicate
  # (N, threshold) combinations. That is one slot counted seven times. A hypothesis
  # whose only signal is one slot losing money is not a weak version of the claim; it
  # is the absence of the claim.
  #
  # THE AGGREGATE IS NEGATIVE BEFORE COSTS. MNQ -0.46 bps GROSS across all 117 cells;
  # MGC +0.03 bps, indistinguishable from zero. Net of the cost floor: -0.94 and -0.62.
  #
  # EVEN THE CHERRY-PICKED CELL FAILS. Best-of-117 is +1.60 bps on MNQ and +1.73 on
  # MGC, against measured detection floors of 2.57 and 4.17 (reports/calibration.md).
  # The best cell anyone could select sits BELOW the level at which a result would
  # carry information, so there is nothing here to pursue at any parameter setting.
  #
  # THE CATALOG PREDICTED THIS EXACT FAILURE MODE and named it the biggest weakness:
  # "the original finding is on individual stocks, where one institution's order is
  # large relative to volume. An index future is the AGGREGATE, so idiosyncratic
  # execution schedules should largely cancel. This is the biggest weakness and the
  # first thing to test." It was tested first, and they cancelled. A pre-registered
  # failure mode arriving as predicted is the strongest form this evidence takes.
  #
  # THRESHOLD READING, decided by measurement (reports/f03_stage1.md). The condition
  # writes the threshold as "x slot sigma" while also demanding a significant trailing
  # t-stat. Read literally that compares a mean of N days against a ONE-DAY sigma —
  # 9.5 standard errors at N=40, thr=1.5 — and fires a median of 40 times across 13
  # slots and ~3,500 sessions, which is not testable. The t-stat reading fires
  # 5,756-29,465 and makes the two clauses one. The t-stat reading was used; the
  # literal one remains available behind --literal.
  #
  # MGC CAVEAT APPLIES HERE TOO: 70.85% RTH coverage, so its null is weaker evidence
  # than MNQ's. See the standing caveat in CLAUDE_FUTURES.md section 3. It does not
  # change the verdict — MNQ carries it at 98.31% coverage — but MGC alone would not.
  #
  # All 234 cells stay in N.
  status: retired
  retired: 2026-09-01
  retired_reason: >
    The mechanism is refuted, not underpowered. F03 had the power —
    detectability cleared it on both instruments and it reached 53,625 independent
    events on MNQ — and found nothing. 8 nominal hits against 5.9
    expected on MNQ, none surviving Benjamini-Hochberg, ALL NEGATIVE,
    and seven of the eight are the same 09:30-10:00 slot under
    near-duplicate parameter combinations. The aggregate is negative on
    MNQ before costs (-0.46 bps gross) and +0.03 bps on MGC. Even the
    best-of-117 cell sits below the measured detection floor on both
    instruments (+1.60 vs 2.57 on MNQ, +1.73 vs 4.17 on MGC), so no
    parameter setting could have carried information. The catalog
    predicted this failure mode and named it the biggest weakness: an
    index future is the aggregate, so idiosyncratic execution schedules
    cancel. They cancelled.
  grade: A-
  tier: A
  param_cap: 3
  session: US
  hold_hours: [0.5]
  # Retired; nothing should schedule it. The registration priority is
  # preserved rather than renumbered away — the order records what was
  # planned, and rewriting it would erase that F03 ran second.
  registered_test_order: 2
  test_order: null
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      Institutional execution schedules on the half hour are not instrument-specific; both hol
      d.
  # BH WITHIN THE HYPOTHESIS ACROSS 13 SLOTS is required by the condition itself, not just
  # by §6. A scan over 13 slots at alpha=0.05 produces 0.65 hits by chance before any
  # parameter is varied, and the full grid is 13 x 3 x 3 = 117 cells per instrument.
  falsification_note: >
    The original finding is on individual stocks, where one institution's order is large
    relative to volume. An index future is the AGGREGATE, so idiosyncratic execution
    schedules should largely cancel — this is the biggest weakness and the first thing to
    test. 52,000 observations means excellent power, which cuts both ways: you will detect
    small effects, including small artifacts.

- id: F04
  name: lbma_auction_flow
  mechanism: >
    The LBMA runs electronic gold price auctions twice per business day, at 10:30 and 15:00
    London time. These set the benchmark prices institutions transact on, and asset
    managers, funds and financial institutions use those windows to rebalance or to execute
    transactions that require the official fixing price. The 15:00 auction is the more
    important because it covers trading in both London and New York, giving commercial
    participants higher liquidity, and many producers are North American. The counterparty
    is whoever provides liquidity to a participant who must transact at the benchmark
    regardless of price. This is the same class of mechanism as F01: scheduled,
    benchmark-anchored, non-discretionary institutional flow.
  condition: >
    For each auction, converted from London local time to ET with DST handling:
    pre = return over [T - pre_window, T]. Test whether pre predicts [T, T + hold]. Test
    both continuation and reversion; the mechanism predicts temporary impact reverting once
    the auction clears. auction in {AM, PM} tested separately, pre_window in {15, 30, 60}
    min, hold in {30, 60, 120} min.
  horizon_minutes: [30, 60, 120]
  registered: 2026-08-28
  # RETIRED 2026-09-01 after Stage 1 on both instruments — reports/f04_stage1.md.
  # 36 cells: 2 auctions x 3 pre-windows x 3 holds, MGC and MNQ.
  #
  # NO CELL SURVIVES BENJAMINI-HOCHBERG ON EITHER INSTRUMENT.
  #   MGC  2 nominal separations against 0.9 expected; 0 survive BH at FDR 0.05
  #        (smallest p 0.0341 against a rank-1 threshold of 0.002778)
  #   MNQ  0 nominal separations against 0.3 expected, across its 6 informative cells
  #
  # AND THE BEST CELL IS NOWHERE NEAR THE FLOOR. Under the corrected per-cell gate
  # (decisions.md section 13) only MGC 120m is per-cell informative; its best cell is
  # 0.09x the measured detection floor. THE 0.30x FIGURE QUOTED IN THE ORIGINAL
  # RETIREMENT IS WITHDRAWN — it came from a 60m cell now known to be below the swept
  # range, and was never a valid comparison. The aggregate route stays open on both
  # instruments and is negative on both: +0.47 bps gross, -0.18 net of the 0.65 bps
  # cost floor on MGC.
  #
  # THE 12 MNQ CELLS AT 30m AND 60m ARE UNINFORMATIVE, NOT EVIDENCE. The condition
  # fires twice a business day and reaches ~8,250 events against the 19,722 at which a
  # floor first resolves for MNQ at that horizon (reports/detectability.md). They are
  # reported for completeness and excluded from the verdict: a null there is the
  # absence of evidence, not evidence of absence. Only MNQ's six 120-minute cells
  # count, and they separate on nothing.
  #
  # THE VERDICT RESTS ON MGC, AT 70.47% FILL COVERAGE. That is correct on the
  # mechanism — the LBMA fixes gold, not the Nasdaq, and MNQ functions here as a
  # confound control rather than a second test of the claim. But under the standing
  # caveat (CLAUDE_FUTURES.md section 3) forward-filling inserts zero returns, thins
  # measured volatility and biases toward APPARENT SIGNIFICANCE, so an MGC null is the
  # weaker kind of null. The deciding instrument is the qualified one.
  #
  # THE GAP IS FAR OUTSIDE WHAT A FILL ARTEFACT COULD PRODUCE. The effect sits 3x to
  # 11x below its floor. A coverage artefact biases toward finding MORE, not less, and
  # nothing about carrying 30% of minutes forward moves an effect an order of magnitude
  # in the direction of nothing. The caveat qualifies the strength of this null; it
  # does not threaten its direction.
  #
  # THIS IS A WEAKER RETIREMENT THAN F03's, and the difference should not be flattened.
  #
  #                        F03                         F04
  #   events          150,355 on MNQ              3,880 on MGC
  #   deciding        MNQ at 98.31% coverage      MGC at 70.47% coverage
