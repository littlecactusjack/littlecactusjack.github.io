- id: L07
  name: fair_value_gap_fill
  # Stage numbering per reports/STAGES.md, adopted 2026-09-12.
  stopped_at: S8
  stopped_at_reason: >
    retired on ECONOMICS, not on significance. All 108 cells separated and every one was negative at 1.8x-10.3x the cost floor.
  mechanism: >
    A three-bar imbalance marks a price zone that traded through quickly with little two-sided
    activity; the claim is that price returns to fill it because the zone contains unfilled
    interest. THE ENTRY RECORDS ITS OWN SCEPTICISM: the competing explanation is that price is
    approximately a random walk with fat tails and revisits nearby levels regardless of what
    happened there - gaps fill because MOST NEARBY PRICES GET REVISITED, not because the gap
    means anything. This is the strongest possible argument for the placebo benchmark: a raw
    fill-rate statistic will look impressive, likely 70-90%, and will be equally impressive for
    placebo zones. Only the difference is evidence. ON THE COUNTERPARTY, HONESTLY: the claimed
    counterparty is whoever left unfilled interest in the zone and must still transact there.
    THE ENTRY DOES NOT BELIEVE THIS PERSON EXISTS - a zone that traded through quickly is
    evidence of ABSENT interest, not resting interest, and no participant is identified who is
    obliged to return. It is registered with the counterparty named so the claim can be
    refuted rather than left vague, which is precisely what makes a clean placebo-controlled
    null on it worth having.
  condition: >
    bullish FVG: high[i-1] < low[i+1], zone = [high[i-1], low[i+1]]. bearish FVG:
    low[i-1] > high[i+1], zone = [high[i+1], low[i-1]]. Minimum zone width w ticks. Entry at
    the first 1m close inside an unfilled zone created >= g bars earlier, direction counter to
    the move that created the gap. Exit at H minutes or 15:55 ET. w in {2, 4, 8} ticks, g in
    {10, 30, 60} bars, H in {60, 120, 180} min, timeframe in {1m, 5m}.
