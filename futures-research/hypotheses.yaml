  # ---- AN UPLIFT WAS CONSIDERED AND DECLINED ----
  # Tightening from the draft's ~10 firings/session to ~6.65 implies, under L07's measured
  # decay exponent 0.412, an effect-size uplift of x1.54 - which would raise this prediction
