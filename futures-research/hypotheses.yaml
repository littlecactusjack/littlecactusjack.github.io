  horizon_minutes: [180]
  hold_hours: [3]
  registered: 2026-09-12
  status: retired
  retired_reason: >
    RETIRED AT S7 ON ITS PRE-REGISTERED CLAUSE: positive pooled mean (~+0.07 bps) with no BH
    survivor, against a registered +2.0 to +5.0. Cells +1.14 / +0.15 / -1.07 bps disagree on
    sign. Power at the 3.5 bps midpoint was 68-78%, so unlike L12 the significance limb was
    reachable, and the magnitude limb refutes independently.
    THE CONDITION WAS MIS-SPECIFIED FOR THIS SAMPLE, and that limits what the null says. N02
    is in POINTS on an index that rose 14x (median 1,939 in 2010, 27,528 in 2026): d=8 points
    was a 41 bps breakout in 2010 and a 2.9 bps one in 2026. The era split flipped sign
    (2010-18 d=8 -8.66 bps p=0.0075; 2024-26 d=2 +4.43 p=0.033) and is UNINTERPRETABLE for
