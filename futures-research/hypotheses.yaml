  # registered claim. The two are different propositions with different counterparties.
  #
  # A POSITIVE RESULT WOULD NOT SUPPORT THE MECHANISM AS WRITTEN. It would say that gold
  # moves directionally after the equity cash open, which is interesting and is not what
  # F06 registered. Promoting it would require RE-REGISTRATION as its own hypothesis with
  # its own counterparty story, its own pre-committed grid and its own trial budget - the
  # same treatment the catalog gives any scan-derived lead.
  #
  # MNQ - THE INSTRUMENT WHERE THE MECHANISM ACTUALLY LIVES - IS CLOSED ON EVERY ROUTE.
  # 1,708 measured events against the 19,722 at which a floor resolves. It is NOT RUN:
  # spending 36 trials on an instrument that cannot carry a verdict would raise SR* for the
  # rest of the catalog and buy nothing. Its absence from the results is a closed route,
  # NOT a null.
  #
  # MGC AT 60 MINUTES IS ALSO CLOSED (1,785 events against 5,620) and its cells are marked
  # uninformative.
  #
  # THE HONEST SUMMARY BEFORE ANY DATA IS SEEN: F06 can only be tested where its mechanism
  # is attenuated, on the shorter of its two open horizons, on the instrument carrying the
  # standing coverage caveat. Whatever comes back, that is the ceiling on what it can mean.
  scope_limit: >
    Both open routes are MGC, where the mechanism is attenuated: 09:30 ET is the EQUITY
    cash open, so on gold the condition tests cross-asset spillover rather than the
    registered claim. A POSITIVE RESULT WOULD NOT SUPPORT THE MECHANISM AS WRITTEN and
    would require re-registration as its own hypothesis with its own counterparty story and
    trial budget. MNQ - where the mechanism actually lives - is closed on every route at
    1,708 events against 19,722 and is NOT RUN; its absence is a closed route, not a null.
  grade: B
  tier: B
  param_cap: 4
  session: US
  hold_hours: [1, 3]
  # Retired; nothing should schedule it. Registration priority preserved.
  registered_test_order: 6
  test_order: null
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      The mechanism names 09:30 ET as the moment overnight positioning meets CASH liquidity. T
      hat is the EQUITY cash open. Gold's own liquidity event is the COMEX open at 08:20 ET, s
      o on MGC this tests a cross-asset spillover rather than the registered mechanism. ATTENU
      ATED - see the audit.
  falsification_note: >
    Opening range breakout is possibly the most widely traded retail futures pattern in
    existence, and any edge has had decades of attention. Treat a POSITIVE result with more
    suspicion than a negative one — this is the one hypothesis in the catalog where a clean
    pass is itself weak evidence of a bug.

- id: F07
  name: gold_session_specific_momentum
  mechanism: >
    Gold's intraday structure is not the equity structure. In the intraday momentum
    literature, for gold the FIFTH half-hour return carries the highest and significantly
    positive predictive power — not the first, as in equities. If that holds it says gold's
    information arrival is anchored to a different point in the session, plausibly the
    London/New York overlap rather than the cash open. The claim under test is that the
    anchor differs between instruments, which is a cleaner question than testing either
    alone.
    NO COUNTERPARTY IS NAMED, AND THAT IS THE POINT. §5 Stage 0 requires a mechanism to say
    who is paying you; this one cannot yet, because which slot carries the effect is being
    discovered rather than predicted. It is registered as a SCAN, a deliberately weaker
    object than a hypothesis: a positive result is a lead that must be re-registered with a
    real counterparty story before it can be promoted, not a candidate in its own right.
    Registering it honestly as exploratory is the alternative to inventing a mechanism to
    fit whichever slot wins.
  condition: >
    For MGC, regress the last-half-hour return on each of the first 12 half-hour returns
    separately and identify which slot predicts, if any. Compare against MNQ's slot
    structure. slot in {1..12}, hold in {30, 60, 90} min.
  horizon_minutes: [30, 60, 90]
  registered: 2026-08-28
  # STAGE 1 RUN 2026-09-02, RECORDED UNINFORMATIVE — reports/f07_stage1.md.
  # NOT retired: no evidence was obtainable at any level, so there is nothing to
  # retire it ON. See reports/decisions.md section 13.
  #
  # NO ROUTE TO A VERDICT, ON EITHER INSTRUMENT, AT EITHER LEVEL.
  #   per cell    ~4,000 events vs a swept range starting at 19,722  BELOW SWEPT RANGE
  #   aggregate   ~4,000 events                                      BELOW SWEPT RANGE
  #
  # THE AGGREGATE DOES NOT RESCUE IT, AND THAT IS THE INTERESTING PART. F03's 13 slots
  # are DISJOINT trades, so pooling multiplies its observations and its aggregate
  # carries a verdict even though no single cell does. F07's 12 slots are twelve
  # PREDICTORS OF ONE TARGET — the catalog regresses the last half-hour on each of the
  # first twelve — so every cell enters on the same 15:30 minute of the same session.
  # Pooling stacks twelve correlated readings of one ~4,000-session sample.
  #
  # WHAT THE NUMBERS WERE, AS DESCRIPTION ONLY. 0 nominal separations on both
  # instruments against 1.8 expected; aggregate -0.00 bps on MGC and +0.09 on MNQ,
  # both negative net of cost. No best-cell-to-floor ratio is quoted, because no floor
  # resolved at this sample size and the denominator would be invented.
  #
  # COST: 72 trials, which enter N and raise SR* for everything still untested. They
  # bought nothing. Recorded rather than hidden.
  #
  # THE REDESIGN THAT WOULD MAKE IT TESTABLE: enter at the CLOSE of slot s and hold h,
  # rather than always at 15:30. That makes the 12 positions disjoint and restores a
  # ~48,000-event aggregate. It is A DIFFERENT HYPOTHESIS — the catalog's F07 is the
  # Gao-style claim about which slot ANCHORS the last-half-hour move; the redesign asks
  # whether slot-by-slot momentum exists at all. It would need its own registration and
  # its own pre-committed grid.
  status: stage1_uninformative
  stage1_run: 2026-09-02
  stage1_reason: >
    No route to a verdict at any level on either instrument. Per-cell
    ~4,000 events against a swept range starting at 19,722, and the
    aggregate does not rescue it because the 12 slots are twelve
    predictors of ONE target rather than twelve disjoint trades — every
    cell enters at the same 15:30 minute, so pooling stacks correlated
    readings of one sample. 0 nominal separations against 1.8 expected,
    aggregate -0.00 bps MGC and +0.09 MNQ, but none of that is evidence.
    72 trials spent, entering N. Not retired: nothing to retire it on.
  grade: B
  tier: B
  param_cap: 3
  session: US
  hold_hours: [0.5, 1.5]
  # Ran and produced no obtainable evidence; nothing should reschedule
  # it as registered. Registration priority preserved, not renumbered.
  registered_test_order: 8
  test_order: null
  symbols: [MGC, MNQ]
  mechanism_instruments:
    primary: MGC
    secondary: MNQ
    rationale: >
      A gold session-structure claim; the catalog registers MNQ explicitly as the comparison a
      rm rather than as a second test.
  is_scan: true
  # REGISTERED AS A SCAN, WHICH IS A WEAKER OBJECT THAN A HYPOTHESIS. The mechanism ("gold's
  # session anchor differs from equities") is a real claim, but WHICH slot carries it is
  # being discovered rather than predicted. All 12 slots are trials and BH applies within
  # the hypothesis. A result here is a lead for a properly pre-registered hypothesis, not a
  # candidate for promotion.
  falsification_note: >
    Closer to exploratory analysis than a hypothesis, and registered as such. Log all 12
    slots as trials.

- id: F08
  name: cross_asset_risk_regime
  mechanism: >
    Gold and equities have an unstable but real relationship: risk-off flows bid gold and
    sell equities, while a rising-real-yield regime pressures both. The relationship inverts
    by regime, which is precisely why a conditional formulation is more defensible than an
    unconditional one. The tradeable version is divergence — when MNQ and MGC both move the
    same direction sharply during a risk-off signal, one of them is wrong, and the
    counterparty is whoever is on the weaker-conviction side of that move.
  condition: >
    If sign(MNQ return over W) equals sign(MGC return over W) and both |r| > k*sigma, fade
    the weaker-conviction leg (the lower volume-weighted move) and exit at H.
    W in {30, 60} min, k in {1, 1.5, 2}, H in {1, 2, 3} h.
  horizon_minutes: [60, 120, 180]
  registered: 2026-08-28
  # ---- REGISTRATION AUDIT 2026-09-02: THREE DEFECTS, NONE FIXED HERE ----
  #
  # 1. "THE LOWER VOLUME-WEIGHTED MOVE" IS UNDEFINED, and it decides which leg is traded -
  #    that is, it decides the entire direction of the strategy. Return times volume?
  #    Return divided by volume? Displacement from VWAP? These give different and sometimes
  #    opposite answers, and nothing in the entry says which.
  #
  # 2. THE TRADED INSTRUMENT VARIES PER EVENT, so `symbols: [MNQ, MGC]` does not mean what
  #    it means elsewhere in this registry. Every other entry runs each instrument as its
  #    own test; F08 requires BOTH legs to fire and then trades ONE of them, chosen per
  #    event by the undefined rule above. The measured firing rate counts JOINT triggers,
  #    not per-instrument trades, so the per-instrument gate rows are not directly
  #    comparable with any other hypothesis's.
  #
  # 3. ITS MANDATORY REGIME SPLIT LIVES IN A NOTE, NOT A FIELD. The falsification note says
  #    "the correlation regime IS the whole strategy... so a regime split is mandatory
  #    rather than a robustness check". That is exactly F02's situation, where the split
  #    requirement sat in F13's exclusion note, the gate never saw it, and the sample was
  #    halved without the gate knowing. F08 will repeat that unless the split becomes a
  #    field the gate reads.
  #
  # THE DECISIONS REQUIRED, none of them mine: how "volume-weighted move" is computed; how
  # the traded leg is recorded so its event count is comparable; and where the regime
  # boundary falls.
  # ---- RETIRED 2026-09-02 ON PREMISE, NOT ON POWER (decisions.md section 29) ----
  #
  # THE MECHANISM DOES NOT SAY WHICH LEG IS MISPRICED. It says that when MNQ and MGC move
  # the same direction sharply during a risk-off signal, "one of them is wrong". That
  # identifies a DIVERGENCE. It does not identify a DIRECTION, and a strategy needs one.
  #
  # The condition supplied a direction anyway - "fade the weaker-conviction leg (the lower
  # volume-weighted move)" - and that rule is ARBITRARY. It appears nowhere in the
  # mechanism, nothing derives it, and it is not even well defined: return times volume,
  # return divided by volume, and displacement from VWAP give different and sometimes
  # opposite answers. A rule invented at the condition stage to fill a gap the mechanism
  # left is a free parameter wearing a mechanism's clothes.
  #
  # SO A RESULT WOULD HAVE BEEN UNREADABLE IN BOTH DIRECTIONS. A pass would not have
  # supported the mechanism, because the mechanism never predicted that direction. A
  # failure would not have refuted it, because the mechanism never predicted the opposite
  # one either. That is the same defect that retired F11: a premise that cannot make the
  # result mean anything.
  #
  # THIS IS A PREMISE FAILURE, NOT A POWER FAILURE, and the two must not blur. F08 was
  # measured at 530-6,151 independent events with 5 of 6 routes open - it had the sample.
  # It fails on what the mechanism licenses, and it would have failed at any sample size.
  # Compare F10, which was retired for the opposite reason: sound premise, no power.
  #
  # TWO FURTHER DEFECTS, recorded because they would matter if it is ever re-registered:
  # the traded instrument varies per event so `symbols` does not mean what it means
  # elsewhere in this registry; and the mandatory regime split its own falsification note
  # requires lives in that note rather than in a field, which is exactly how F02's split
  # escaped the gate.
  #
  # NO TRIALS SPENT: it was never run.
  status: retired
  retired: 2026-09-02
  retired_reason: >
    PREMISE FAILURE, not a power failure. The mechanism identifies a
    divergence - when MNQ and MGC move together sharply, one is wrong -
    but it does not say WHICH leg is mispriced. The condition supplied a
    direction anyway, fading the lower volume-weighted move, and that
    rule appears nowhere in the mechanism, is derived from nothing, and
    is not well defined. A pass would not have supported the mechanism
    and a failure would not have refuted it. It had the sample -
    530-6,151 measured events, 5 of 6 routes open - and would have
    failed at any sample size. Same class as F11; the opposite of F10,
    which had a sound premise and no power. Never run, no trials spent.
  grade: B-
  tier: B
  param_cap: 3
  session: both
  hold_hours: [1, 3]
  # Retired before running; nothing should schedule it. Registration priority
  # preserved rather than renumbered away.
  registered_test_order: 9
  test_order: null
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      Cross-asset by construction - it REQUIRES both legs. Neither is optional and neither is 
      a control.
  # PAYS TWO SETS OF COSTS. This is a pairs trade in disguise, so its floor is 1.13 bps
  # (MNQ 0.48 + MGC 0.65), not 0.48. §4 requires the cost model to charge both legs, and
  # any reported net figure that uses a single-leg floor is wrong by more than a factor of
  # two.
  falsification_note: >
    The correlation regime IS the whole strategy and it is unstable across the sample, so a
    regime split is mandatory rather than a robustness check.

- id: F09
  name: settlement_anchored_flow
  mechanism: >
    Daily settlement is the price institutions use for margining, P&L and risk models —
    15:00 ET for equity index futures and 13:30 ET for COMEX gold. Positions marked against
    it create flow into the window from anyone whose risk system references it, and
    practitioner accounts describe a flurry of activity before the window followed by calm
    after. The counterparty is whoever provides liquidity to a participant who must be
    positioned by the settlement print regardless of price.
  condition: >
    pre = return over [S - pre_window, S - 15min]. Enter at S - 15min and exit at S + hold.
    Test both continuation and reversion. instrument in {MNQ 15:00, MGC 13:30},
    pre_window in {30, 60} min, hold in {30, 60, 90} min.
  horizon_minutes: [30, 60, 90]
  registered: 2026-08-28
  # ---- REGISTRATION AUDIT 2026-09-02: ONE DEFECT, AND IT IS THE CLEANEST ENTRY HERE ----
  #
  # The condition is well specified: no undefined threshold, both directions named, and a
  # separate settlement time given per instrument. Nothing needs deciding before it could
  # run.
  #
  # THE DEFECT IS OVERLAP WITH F01, and the entry's own falsification note names it: "two
  # hypotheses firing in the same window on the same instrument are one observation dressed
  # as two". On MNQ, F09 enters at 14:45 ET and F01 at 15:00 or 15:30, and both are out by
  # ~15:55. Their trades overlap for most of their lives. If both were counted as
  # independent evidence about the same afternoon, the catalog would be double-counting.
  #
  # It is MOOT TODAY because F01 is blocked_insufficient_events and F09 is closed on both
  # routes (2,365-3,406 measured events against MNQ's 19,722). It stops being moot the
  # moment either is revived, so it is recorded rather than left to be rediscovered.
  #
  # No specification_defect field: there is nothing to decide, only something to remember.
  status: untested
  grade: B-
  tier: B
  param_cap: 3
  session: US
  hold_hours: [0.5, 1.5]
  test_order: 7
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      Both instruments have a daily settlement print that risk systems reference; the registry
       names each one's time separately.
  # NOT INDEPENDENT OF F01. MNQ's 15:00 ET settlement overlaps F01's entry window, so a hit
  # on one may BE the other. §6 counts them as one family for any cross-hypothesis claim,
  # and they must be tested jointly before either is treated as confirmed. Scheduling F09
  # immediately after F01 (test_order 7 against F01's 1) is deliberate so the joint test is
  # cheap to run while F01's cells are fresh.
  falsification_note: >
    The overlap with F01 is the main risk: two hypotheses firing in the same window on the
    same instrument are one observation dressed as two.

- id: F10
  name: rsi_mean_reversion_control
  mechanism: >
    NOT A HYPOTHESIS. A control that exists to be FAILED by the harness. RSI(14) with 30/70
    thresholds is the most widely published mean-reversion rule in retail trading; if it
    carried an edge it would have been arbitraged decades ago. There is no counterparty
    story, deliberately.
  condition: >
    RSI(14) crossing up through 30 goes long, crossing down through 70 goes short, exit
    after hold. Thresholds and period are FIXED A PRIORI and never swept. hold is the only
    parameter.
  horizon_minutes: [30, 60, 120]
  registered: 2026-08-28
  # RETIRED 2026-09-02: SOUND PREMISE, PERMANENTLY UNPOWERED. decisions.md section 17.
  #
  # 1,585 to 5,594 independent events against a swept range starting at 19,722. RSI(14)
  # crossings through 30 and 70 are simply rare: 2,434 up and 3,160 down across sixteen
  # years of MNQ. An unpowered control coming back empty is indistinguishable from a
  # powered one working correctly, so it cannot support the one claim it exists to make.
  #
  # NO TUNING FIXES A FIRING RATE. The rate is a property of the condition and the data,
  # not a parameter, and the thresholds are fixed a priori precisely so they cannot be
  # moved. Loosening them to fire more often would be tuning a control, which is the one
  # thing a control may never permit.
  #
  # Its premise was better than F11's - RSI(14) 30/70 on intraday futures has far less
  # published support than time-series momentum - but 'should have been arbitraged away'
  # is still a market prediction rather than a construction. Replaced by F14, which
  # cannot relate to returns by construction. No trials were spent: it was never run.
  status: retired
  retired: 2026-09-02
  retired_reason: >
    SOUND PREMISE, PERMANENTLY UNPOWERED. 1,585-5,594 independent events
    against a swept range starting at 19,722, and no tuning fixes a firing
    rate: the rate is a property of the condition and the data, not a
    parameter, and loosening the a-priori thresholds to fire more often
    would be tuning a control. An unpowered control coming back empty is
    indistinguishable from a powered one working correctly. Never run, no
    trials spent. Replaced by F14.
  grade: D
  tier: C
  param_cap: 1
  session: US
  hold_hours: [0.5, 2]
  test_order: null
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      An indicator computed on each instrument's own price series, so it is mechanism-agnostic
       across both. It was retired for being permanently unpowered at its own firing rate, not
       for any instrument mismatch.
  is_control: true
  # CLEARING STAGE 1 IS A HARNESS BUG, NOT A FINDING. If this separates, HALT: do not
  # investigate the result, run the §7.2 synthetic-noise test and find what is broken. A
  # control that passes invalidates every result the harness has produced.

- id: F11
  name: ma_crossover_control
  mechanism: >
    NOT A HYPOTHESIS. The second control. A fast/slow moving-average crossover is the
    canonical published trend rule and has no counterparty story. Two parameters rather than
    F10's one, so the pair also gives a crude read on whether the harness's behaviour
    depends on the size of the grid it is handed.
  condition: >
    Long when the fast MA is above the slow MA, short when below, evaluated at bar close.
    fast and slow fixed a priori at round values; exit at the hold.
  horizon_minutes: [30, 60, 120]
  registered: 2026-08-28
  # RETIRED 2026-09-02: NOT A CONTROL. reports/decisions.md section 17.
  #
  # Its premise was that a canonical published trend rule SHOULD HAVE BEEN ARBITRAGED
  # AWAY. That is a contestable prediction about the market, not a construction - and if
  # the prediction is wrong, the control is silently a hypothesis. A fast/slow moving-
  # average crossover is TIME-SERIES MOMENTUM, among the best-documented anomalies in
  # futures specifically, and the managed-futures industry is built on it.
  #
  # DECISIVELY: F01 IN THIS CATALOG IS A MOMENTUM HYPOTHESIS and F11 is a slow momentum
  # rule - the same family. A promotion would be unreadable: there would be no way to
  # tell a harness failure from a true detection, which is exactly the distinction a
  # negative control exists to draw.
  #
  # Note it was POWERED - 43,759 to 173,879 independent events, resolvable everywhere.
  # It fails on premise, not on sample, and would have failed at any sample size. No
  # trials were spent: it was never run.
  status: retired
  retired: 2026-09-02
  retired_reason: >
    NOT A CONTROL. Its premise was that a canonical published trend rule
    should have been arbitraged away, which is a contestable market
    prediction rather than a construction. A fast/slow MA crossover is
    time-series momentum, the same family as F01, so a promotion would be
    unreadable as either harness failure or true detection. It was POWERED
    (43,759-173,879 independent events); it fails on premise and would have
    failed at any sample size. Never run, no trials spent. Replaced by F14.
  grade: D
  tier: C
  param_cap: 2
  session: US
  hold_hours: [0.5, 2]
  test_order: null
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      Likewise computed on each instrument's own series and agnostic across both. It was retir
      ed because a moving-average crossover is time-series momentum - the same family as F01 -
       and so cannot serve as a control, not for any instrument mismatch.
  is_control: true

- id: F12
  name: pre_fomc_announcement_drift
  mechanism: >
    Lucca & Moench (2015) found the S&P 500 rises an average 49 basis points in the 24 hours
    before scheduled FOMC announcements, accounting for roughly 80% of annual returns, with
    a Sharpe of 1.14 for buying at 14:00 the prior day and selling 15 minutes before the
    announcement, and a similar magnitude in the German DAX. The effect is not explained by
    the announcement surprise — returns at and after the announcement are approximately zero.
  condition: >
    Buy at 14:00 ET the day before a scheduled FOMC announcement, sell 15 minutes before it.
    NOT IMPLEMENTED — see the exclusion reason.
  horizon_minutes: [1440]
  registered: 2026-08-28
  status: excluded
  excluded: 2026-08-28
  excluded_reason: >
    Two independent reasons, either sufficient. FIRST, EVENT COUNT: eight announcements a
    year is roughly 128 over the 2010-2026 sample, far below the firing-rate gate. A 49 bps
    effect cannot be established on 128 observations against index volatility, and a null
    would be uninterpretable — the test has no power to distinguish "absent" from
    "undetectable". SECOND, THE PROP CONSTRAINT: a 24-hour hold from 14:00 the prior day
    necessarily crosses the 17:00 ET hard exit, so the strategy as published cannot be
    executed on this account at all. A truncated version is a different hypothesis and
    needs its own registration and validation.
  grade: A
  tier: excluded
  param_cap: 0
  session: US
  hold_hours: [24]
  test_order: null
  symbols: [MNQ]
  # KEEP THIS ENTRY. It is this catalog's version of the crypto project's CME gap: a large,
  # famous, well-documented effect that the pipeline cannot evaluate. Excluding it on
  # MEASURED grounds before a single trial is spent is the gate doing its job, and recording
  # it is what stops it being rediscovered and re-argued later.
  #
  # The literature is also split on whether the effect still exists — one line of work finds
  # it essentially disappeared after 2015 in both press-conference and non-press-conference
  # announcements, attributing it to reduced uncertainty; other commentary argues it
  # persists. That question is unresolved AND unresolvable on this sample, which is a
  # second-order reason rather than the reason.
  #
  # THE SAME EXCLUSION APPLIES TO CPI, NFP AND EVERY OTHER SCHEDULED RELEASE: ~200
  # observations maximum over the sample, below the gate. Do not register them individually.

- id: F13
  name: unconditional_overnight_drift
  mechanism: >
    Boyarchenko, Larsen & Whelan (RFS 2023) documented that almost the entire US equity
    premium accrued in the 02:00-03:00 ET window when European equity markets open — 3.6%
    annualized over 1998-2019, and more than 60% of the contract's 5.9% annualized
    close-to-close return.
  condition: >
    Buy at 02:00 ET, sell at 03:00 ET, unconditionally. NOT IMPLEMENTED — see the exclusion
    reason.
  horizon_minutes: [60]
  registered: 2026-08-28
  status: excluded
  excluded: 2026-08-28
  excluded_reason: >
    Measured as decayed by its own authors. "The Disappearing Overnight Drift" (July 2026)
    reports that the 02:00-03:00 ET window has averaged close to zero since 2021. Testing
    the unconditional version would spend trials confirming a published null on a sample
    where more than half the history predates the decay, and an aggregate across the break
    would be uninterpretable in either direction. The CONDITIONAL version is registered
    separately as F02, which is the tradeable form and carries a mandatory regime split.
  grade: A
  tier: excluded
  param_cap: 0
  session: Europe
  hold_hours: [1]
  test_order: null
  symbols: [MNQ]
  # RECORDED SO IT IS NOT REDISCOVERED. An entry that says "this was checked and it decayed"
  # is worth more than an absent entry, because the absent entry gets re-proposed the next
  # time someone reads the 2023 paper without the 2026 follow-up.

- id: F14
  name: timestamp_hash_control
  # REGISTERED 2026-09-02 as the catalog's negative control, replacing F10 and F11.
  # Firing rates measured BEFORE registration: reports/control_candidates.md.
  #
  # ID NOTE: requested as "F12", but F12 is the excluded pre_fomc_announcement_drift entry
  # and reusing the id would have erased a deliberate exclusion and its two independent
  # reasons. Registered as F14, the next free id.
  #
  # PARAMETERS ARE FIXED HERE, IN WRITING, BEFORE ANY RUN. That is the whole point of the
  # ordering: a control whose parameters could be chosen after seeing a result is not a
  # control. There are no free parameters at all - param_cap is 0, stronger than F10's 1
  # and F11's 2 - so there is nothing to sweep and nothing to tune.
  #
  #     signal     SHA-256 of the bar's ISO timestamp, low bit: 1 -> long, 0 -> short
  #     fires      at each 30-minute RTH slot open (09:30, 10:00, ... 15:30 ET)
  #     holds      30, 60, 120 minutes
  #     symbols    MNQ and MGC
  #
  # WHY IT IS MECHANISM-FREE BY CONSTRUCTION, which is the requirement F11 failed. The
  # direction is a deterministic function of the CLOCK ALONE and never touches price. It is
  # aperiodic, and because each date hashes differently it cannot align with time-of-day. A
  # reader can recompute any single direction from the timestamp and confirm no price
  # entered it. This is not a claim that the signal SHOULD have no edge; it is a claim that
  # it CANNOT, which is the only kind of premise a control may rest on.
  #
  # MEASURED FIRING RATE, before registration: 9.2 firings per session on MNQ and 7.9 on
  # MGC - NOT the 13 the RTH slot count implies, because a slot fires only when a bar exists
  # at that exact minute. 45,513 independent events on MNQ and 38,494 on MGC, RESOLVABLE in
  # all 12 of 12 combinations against a swept range starting at 19,722.
  #
  # ================= SCOPE OF WHAT THIS CONTROL LICENSES =================
  #
  # IT VALIDATES THE HARNESS AT F03-LIKE EVENT COUNTS ONLY. It fires roughly nine times a
  # session, so it demonstrates that the pipeline declines to promote a mechanism-free
  # signal on real futures data at ~40,000-event samples. It demonstrates NOTHING about
  # behaviour at ~4,000-event samples, and that claim must not be generalised.
  #
  # NO CONTROL EXISTS FOR THE ONCE-A-SESSION REGIME ON THIS DATA, and none can be built. A
  # once-a-session condition over sixteen years yields ~3,500 events against MNQ's 19,722.
  # That is a property of the sample, not of any signal: measured candidates at that regime
  # resolved in 2 of 12 combinations, and the two were MGC at the longest hold, on the
  # instrument carrying the coverage caveat. F01, F02, F04, F06 and F09 all live in that
  # regime and NONE of them has a control. The synthetic GARCH nulls in
  # reports/integrity_futures.md remain the only check that applies there, and they test
  # the harness on idealised noise rather than on real microstructure.
  #
  # =======================================================================
  mechanism: >
    NOT A HYPOTHESIS. The catalog's negative control, replacing F10 and F11. The direction
    is the low bit of the SHA-256 hash of the bar's timestamp: a deterministic function of
    the clock that never touches price, is aperiodic, and cannot align with time-of-day
    because each date hashes differently. There is no counterparty story because there is
    nothing for a counterparty to trade against. Unlike F10 and F11, the premise is not
    that this effect should have been arbitraged away - a contestable prediction about the
    market - but that it cannot relate to future returns BY CONSTRUCTION.
  condition: >
    At each 30-minute RTH slot open (09:30 through 15:30 ET), enter long if the low bit of
    SHA-256 of the bar's ISO timestamp is 1, short otherwise, and exit after hold. hold in
    {30, 60, 120} min. There are no other parameters and none may be added or swept.
  horizon_minutes: [30, 60, 120]
  hold_hours: [0.5, 2]
  registered: 2026-09-02
  # STAGE 1 RUN 2026-09-02 - PASS. The control did not separate.
  # reports/f14_stage1.md. 6 trials, natively logged - the first native records in
  # trials.jsonl, every earlier one having been backfilled.
  #
  #   MNQ  47,866 events/cell   p = 0.9902, 0.6170, 0.7827   mean -0.00 to +0.10 bps
  #   MGC  51,753 events/cell   p = 0.7693, 0.4952, 0.6510   mean -0.11 to -0.03 bps
  #
  # 0 nominal separations against 0.30 expected by chance. 0 BH survivors on either
  # instrument. Aggregate +0.06 bps MNQ and -0.08 MGC, both negative net of cost.
  # Long share 0.497 on both, so the hash is not degenerate.
  #
  # WHAT THIS LICENSES, AND ONLY THIS. The harness declines to promote a signal that
  # cannot relate to future returns by construction, on real futures data with real
  # gaps, real volatility clustering and real session boundaries, AT ~48,000-52,000
  # EVENT SAMPLES. See control_scope: it says nothing about the once-a-session regime
  # where F02, F04, F06 and F09 live, and no control can be built there.
  #
  # STAYS untested -> stage1_passed IS NOT USED HERE. A control that behaves correctly
  # has not been 'passed' in the sense that status means for a hypothesis - it was
  # never a candidate. It is recorded as control_result: pass, and it should be RE-RUN
  # whenever the harness changes, which is the opposite of a resolved entry.
  status: untested
  control_result: pass
  control_last_run: 2026-09-02
  control_reason: >
    0 nominal separations against 0.30 expected, 0 BH survivors on
    either instrument, aggregate +0.06 bps MNQ and -0.08 MGC and both
    negative net of cost, across 47,866 events per cell on MNQ and
    51,753 on MGC. Long share 0.497 on both, so the signal is not
    degenerate. Re-run whenever the harness changes: a control is a
    standing check, not a resolved entry.
  grade: D
  tier: C
  param_cap: 0
  session: US
  symbols: [MNQ, MGC]
  mechanism_instruments:
    primary: MNQ
    secondary: MGC
    rationale: >
      Mechanism-free by construction, so no instrument can fail to support it.
  is_control: true
  test_order: null
  # A machine-readable field, NOT a comment. The scope is part of the claim the control
  # licenses, and yaml.safe_load discards comments - anything a tool must be able to check
  # has to live in the data. This one is asserted by
  # test_the_live_control_states_the_regime_it_validates.
  control_scope: >
    Validates the harness at F03-like event counts ONLY. F14 fires ~9.2 times a session on
    MNQ and 7.9 on MGC, reaching ~45,513 and ~38,494 independent events, so it demonstrates
    that the pipeline declines to promote a mechanism-free signal on real futures data at
    ~40,000-event samples. It demonstrates NOTHING about ~4,000-event samples and the claim
    must not be generalised. NO CONTROL EXISTS FOR THE ONCE-A-SESSION REGIME on this data
    and none can be built: a once-a-session condition over sixteen years yields ~3,500
    events against MNQ's 19,722, which is a property of the sample rather than of any
    signal. F01, F02, F04, F06 and F09 all live in that regime and none of them has a
    control; the synthetic GARCH nulls in reports/integrity_futures.md are the only check
    that applies there, and they test idealised noise rather than real microstructure.

# ============================================================================
# L-SERIES - price-level reaction. Registered 2026-09-02 from
# LEVEL_HYPOTHESES.md. Same registry, same N, same gates.
#
# THE METHODOLOGICAL CORE, WHICH APPLIES TO EVERY ENTRY BELOW: price
# mean-reverts and continues around ARBITRARY levels, so the null for a level
# test is not "no reaction" - it is "no reaction BEYOND a matched placebo
# level". Every L-series result reports real-minus-placebo alongside
# real-minus-zero, and a hypothesis whose real-minus-placebo difference is
# indistinguishable from zero is refuted even if its raw reaction is strongly
# significant. See src/futuresres/levels/placebo.py and reports/placebo_match.md.
#
# THE TWO-MECHANISM PROBLEM: one mechanism (orders cluster at reference levels)
# licenses two opposite predictions (absorption vs sweep). Testing both on the
# same condition is the F08 failure - an invented direction rule. Each entry
# below either pre-specifies its direction from a DISTINGUISHING CONDITION, or
# is registered magnitude-only.
#
# VERDICT ROUTE: level cells overwhelmingly SHARE ENTRY TIMESTAMPS - the same
# touch enters under multiple parameter settings - so the aggregate route is
# ASSUMED CLOSED for every entry until disjointness is verified, per the F07
# finding. See reports/disjointness.md.
# ============================================================================

