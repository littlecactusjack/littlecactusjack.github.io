  #   events per cell      11,000-18,600                ~3,950
  #   deciding instrument  MNQ at 83.16% coverage       MGC at 70.88%
  #   mechanism there      holds in both instruments    ATTENUATED - 09:30 ET is the
  #                                                     EQUITY cash open, not gold's
