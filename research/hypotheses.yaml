# Hypothesis registry. Same rules as futures-research/hypotheses.yaml (read its header).
#
# A hypothesis can be run only when its status is `registered`, and it may become
# `registered` only once every field below is filled in BEFORE the data is examined:
#   id · name · mechanism (who loses money to this trade, and why they keep doing it)
#   condition (exact, unit-free: bps, volatility units or ranks, never points or ticks)
#   params (every value, and param_cap: how many cells the scan may have)
#   horizon_minutes · symbols · session (must exit by 17:00 ET under the prop rules)
#   prediction (expected net effect in bps, checked against the BH bar at expected n)
#   control (the placebo or matched control the result is reported against)
#   prior_evidence (which futures-research trials already looked at this; see below)
#
# status: draft → registered → completed | retired | inconclusive | blocked
# Nothing is ever deleted. Withdrawn entries stay, and their trials stay in N.

- id: C01
  name: cisd_with_htf_poi_filter
  status: draft
  mechanism: >
    TO WRITE. The strategy's own logic: a Change In State of Delivery on the execution
    timeframe, taken only inside a higher-timeframe point-of-interest zone, in a manually
    chosen direction. S1 needs a plain-language answer to who is on the other side.
  prior_evidence: >
    Overlaps futures-research L02 (opening range boundary), L03 (prior-day sweep and reclaim)
    and L07 (fair value gap fill), all tested on MNQ 2010-2026 and all closed. L07 was
    negative in 108 of 108 cells at 1.8-10.3x cost, and its decisions.md 38 refused a
    perfect-looking separation over a real-vs-placebo timing confound. C01 must state how
    it differs from each before registration.
  open_questions:
    - The manual direction input is a discretionary parameter. It must be replaced by a
      rule fixed in advance, or the backtest is testing the trader, not the signal.
    - Pine Script source is not in the repo yet (research/pine/).
